services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: booknook
      POSTGRES_PASSWORD: booknook
      POSTGRES_DB: booknook
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booknook -d booknook"]
      interval: 5s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:3-alpine
    environment:
      RABBITMQ_DEFAULT_USER: booknook
      RABBITMQ_DEFAULT_PASS: booknook
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12

  redis:
    image: redis:7-alpine

  web:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: &backend
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: dev-only-booknook-key
      DATABASE_URL: postgres://booknook:booknook@postgres:5432/booknook
      CELERY_BROKER_URL: amqp://booknook:booknook@rabbitmq:5672//
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "0"
      ALLOW_DEV_AUTH: "1"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MOCK_PAY_SECRET: booknook-mock
      LLM_PROVIDER: mock
    command: python manage.py migrate && python manage.py runserver 0.0.0.0:8000
    ports:
      - "8020:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend
    command: celery -A config.celery:app worker --loglevel=info
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      FAQ_PATH: /app/sample_data/faq.json
    ports:
      - "8081:8081"

  webapp:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8020
    ports:
      - "5173:5173"
    depends_on:
      - web
